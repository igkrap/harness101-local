<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 보드</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            outline: none;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .filters {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-bottom: 15px;
        }
        .filter-btn {
            background-color: #eee;
            color: #333;
            font-size: 0.8rem;
        }
        .filter-btn.active {
            background-color: #007bff;
            color: white;
        }
        .todo-list {
            list-style: none;
            padding: 0;
        }
        .todo-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .todo-item:last-child {
            border-bottom: none;
        }
        .todo-item.done span {
            text-decoration: line-through;
            color: #888;
        }
        .todo-item span {
            flex-grow: 1;
            margin: 0 10px;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 0.8rem;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .stats {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>할 일 보드</h1>
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="새로운 할 일 입력...">
            <button id="add-btn">추가</button>
        </div>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">전체</button>
            <button class="filter-btn" data-filter="active">진행 중</button>
            <button class="filter-btn" data-filter="completed">완료</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <div id="stats" class="stats"></div>
    </div>

    <script>
        let todos = [];
        let currentFilter = 'all';

        const todoInput = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');
        const stats = document.getElementById('stats');
        const filterBtns = document.querySelectorAll('.filter-btn');

        async function fetchTodos() {
            const res = await fetch('/api/todos');
            const data = await res.json();
            todos = data.items;
            render();
        }

        async function addTodo() {
            const title = todoInput.value.trim();
            if (!title) return;

            const res = await fetch('/api/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            if (res.ok) {
                todoInput.value = '';
                await fetchTodos();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        }

        async function toggleTodo(id, done) {
            const res = await fetch(`/api/todos/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ done: !done })
            });
            if (res.ok) {
                await fetchTodos();
            }
        }

        async function deleteTodo(id) {
            const res = await fetch(`/api/todos/${id}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                await fetchTodos();
            }
        }

        function render() {
            todoList.innerHTML = '';
            let filtered = todos;
            if (currentFilter === 'active') {
                filtered = todos.filter(t => !t.done);
            } else if (currentFilter === 'completed') {
                filtered = todos.filter(t => t.done);
            }

            filtered.forEach(todo => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.done ? 'done' : ''}`;
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.done;
                checkbox.onclick = () => toggleTodo(todo.id, todo.done);

                const span = document.createElement('span');
                span.textContent = todo.title;

                const delBtn = document.createElement('button');
                delBtn.textContent = '삭제';
                delBtn.className = 'delete-btn';
                delBtn.onclick = () => deleteTodo(todo.id);

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(delBtn);
                todoList.appendChild(li);
            });

            const remaining = todos.filter(t => !t.done).length;
            stats.textContent = `남은 일 ${remaining}개`;
        }

        addBtn.onclick = addTodo;
        todoInput.onkeypress = (e) => { if (e.key === 'Enter') addTodo(); };

        filterBtns.forEach(btn => {
            btn.onclick = () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            };
        });

        fetchTodos();
    </script>
</body>
</html>
