spring.application.name=local-inventory
spring.datasource.url=${DB_URL:jdbc:postgresql://mdi-db:5432/mdi_local}
spring.datasource.username=mdi
spring.datasource.password=mdi
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${WORKSPACE_SESSION_SECURE:false}
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.mvc.problemdetails.enabled=true
# Screens, styles and answers go compressed (the built screens are large text; an operating copy may sit behind a slow line).
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
